<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 대모험</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#241b4a;--sub:#6b6490;--pri:#6c4cf5;--ok:#17a86b;--bad:#e5484d;--gold:#f5a524;--line:#e3ddff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112b;--card:#221c45;--tx:#f1eeff;--sub:#a59ed0;--pri:#9a82ff;--ok:#3ddc97;--bad:#ff6b6f;--gold:#ffc44d;--line:#372f68}}
:root[data-theme="dark"]{--bg:#15112b;--card:#221c45;--tx:#f1eeff;--sub:#a59ed0;--pri:#9a82ff;--ok:#3ddc97;--bad:#ff6b6f;--gold:#ffc44d;--line:#372f68}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));width:0;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--tx);border-radius:12px;padding:8px 14px;font-size:15px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;text-align:left;cursor:pointer;font-size:14px}
.mode b{display:block;font-size:16px;margin-bottom:2px}
.mode:active{transform:scale(.97)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:2px solid var(--line)}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:8px}
.q{font-size:44px;text-align:center;font-weight:800;padding:26px 6px;border-radius:16px;transition:background .15s}
.q.ok{background:color-mix(in srgb,var(--ok) 25%,transparent)}
.q.bad{background:color-mix(in srgb,var(--bad) 25%,transparent);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
input.ans{width:100%;font-size:30px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-size:26px;font-weight:800;color:var(--gold);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{top:18%;opacity:0}}
.big{font-size:54px;text-align:center}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{text-align:center;font-size:12px;padding:8px 4px;border-radius:12px;border:1px solid var(--line)}
.bd span{font-size:28px;display:block}.bd.lock{opacity:.35;filter:grayscale(1)}
.cols{display:flex;align-items:flex-end;gap:6px;height:90px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}
.rowp{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.rowp .bar{flex:1}.rowp b{width:44px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const OPS={'+':'덧셈','-':'뺄셈','×':'곱셈','÷':'나눗셈','m':'혼합'};
const DIFF={1:['초급','1~10',10],2:['중급','1~50',50],3:['고급','1~100',100]};
const MODES={ta:['⏱️','타임어택','60초 안에 최대한 많이!'],inf:['♾️','무한모드','시간 제한 없이 연습'],ch:['🏆','챌린지','10문제 연속 정답 시 레벨업'],ms:['👑','마스터전','혼합 연산 5문제 클리어']};
const BADGES=[
['first','🌱','첫 정답',s=>tot(s)>=1],['c5','🔥','5연속',s=>s.maxCombo>=5],['c10','⚡','10연속',s=>s.maxCombo>=10],
['t100','💯','100문제',s=>tot(s)>=100],['t500','🚀','500문제',s=>tot(s)>=500],['ta20','⏱️','타임어택 20+',s=>s.best.ta>=20],
['ch','🏆','챌린지 클리어',s=>s.wins.ch>0],['ms','👑','마스터 클리어',s=>s.wins.ms>0],['lv5','⭐','레벨 5',s=>lvl(s.xp)>=5],
['add','➕','덧셈왕(50)',s=>s.ops['+'][0]>=50],['mul','✖️','곱셈왕(50)',s=>s.ops['×'][0]>=50],['div','➗','나눗셈왕(50)',s=>s.ops['÷'][0]>=50]];
const tot=s=>Object.values(s.ops).reduce((a,v)=>a+v[0],0);
const lvl=x=>Math.floor(x/100)+1;
const day=()=>new Date().toLocaleDateString('sv');
const def=()=>({xp:0,badges:[],days:{},ops:{'+':[0,0],'-':[0,0],'×':[0,0],'÷':[0,0],m:[0,0]},best:{ta:0},wins:{ch:0,ms:0},maxCombo:0});
let S;try{S=JSON.parse(localStorage.getItem('mq3'))||def()}catch(e){S=def()}
const save=()=>{try{localStorage.setItem('mq3',JSON.stringify(S))}catch(e){}};
let cfg={ops:['+','-'],diff:1},G=null,timer=null;
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),app=$('#app');

function xpBar(){const x=S.xp%100;return `<div class="card"><div class="top"><b>Lv.${lvl(S.xp)}</b><span class="sub">${x}/100 XP</span></div><div class="bar" style="margin-top:6px"><i style="width:${x}%"></i></div></div>`}

function home(){
 clearInterval(timer);G=null;
 app.innerHTML=`<div class="top" style="margin-bottom:10px"><h1>🧮 수학 대모험</h1><button class="chip" onclick="stats()">📊 통계</button></div>${xpBar()}
 <div class="card"><h2>연산 종류</h2><div class="chips">${['+','-','×','÷'].map(o=>`<button class="chip ${cfg.ops.includes(o)?'on':''}" onclick="tog('${o}')">${OPS[o]} ${o}</button>`).join('')}</div>
 <h2 style="margin-top:12px">난이도</h2><div class="chips">${[1,2,3].map(d=>`<button class="chip ${cfg.diff==d?'on':''}" onclick="cfg.diff=${d};home()">${DIFF[d][0]} (${DIFF[d][1]})</button>`).join('')}</div></div>
 <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="mode" onclick="start('${k}')"><b>${m[0]} ${m[1]}</b><span class="sub">${m[2]}</span></button>`).join('')}</div>
 <div class="card" style="margin-top:12px"><h2>뱃지 ${S.badges.length}/${BADGES.length}</h2><div class="badges">${BADGES.map(b=>`<div class="bd ${S.badges.includes(b[0])?'':'lock'}"><span>${b[1]}</span>${b[2]}</div>`).join('')}</div></div>`;
}
function tog(o){const i=cfg.ops.indexOf(o);if(i>=0){if(cfg.ops.length>1)cfg.ops.splice(i,1)}else cfg.ops.push(o);home()}

function gen(){
 const M=DIFF[cfg.diff][2],F=Math.min(M,12);
 if(G.mode=='ms'){
  const t=R(1,4),a=R(2,Math.min(M,20)),b=R(2,9),c=R(2,9);
  if(t==1)return{t:`${a} + ${b} × ${c}`,a:a+b*c,o:'m'};
  if(t==2)return{t:`(${a} + ${b}) × ${c}`,a:(a+b)*c,o:'m'};
  if(t==3)return{t:`${a*b} ÷ ${b} + ${c}`,a:a+c,o:'m'};
  return{t:`${a} × ${b} − ${R(1,a*b)>0?c:c}`,a:a*b-c,o:'m'};
 }
 const o=cfg.ops[R(0,cfg.ops.length-1)];let a,b;
 if(o=='+'){a=R(1,M);b=R(1,M);return{t:`${a} + ${b}`,a:a+b,o}}
 if(o=='-'){a=R(1,M);b=R(1,M);if(b>a)[a,b]=[b,a];return{t:`${a} − ${b}`,a:a-b,o}}
 if(o=='×'){a=R(1,M);b=R(1,F);return{t:`${a} × ${b}`,a:a*b,o}}
 b=R(1,F);const q=R(1,F);return{t:`${b*q} ÷ ${b}`,a:q,o};
}

function start(mode){
 G={mode,score:0,ok:0,bad:0,combo:0,maxC:0,streak:0,lives:3,xp:0,t:60,q:null,lvl0:lvl(S.xp)};
 app.innerHTML=`<div class="hud"><span id="h1"></span><span id="h2"></span><span id="h3"></span></div><div class="bar" id="tb" style="margin-bottom:10px"><i style="width:100%"></i></div>
 <div class="q" id="q"></div><input class="ans" id="in" inputmode="numeric" autocomplete="off" placeholder="정답 입력">
 <div class="row"><button class="btn" onclick="submit()">확인 ⏎</button><button class="btn ghost" onclick="end(false)">${mode=='inf'?'그만하기':'포기'}</button></div>`;
 $('#in').addEventListener('keydown',e=>{if(e.key=='Enter')submit()});
 if(mode=='ta'){const t0=Date.now();timer=setInterval(()=>{G.t=Math.max(0,60-(Date.now()-t0)/1000);hud();if(G.t<=0)end(true)},100)}
 else $('#tb').style.display='none';
 next();
}
function next(){G.q=gen();$('#q').textContent=G.q.t+' = ?';$('#q').className='q';const i=$('#in');i.value='';i.focus();hud()}
function hud(){
 const m=G.mode;
 $('#h1').textContent=m=='ta'?`⏱️ ${Math.ceil(G.t)}초`:m=='ms'?`❤️ ${'❤️'.repeat(G.lives).slice(2)||'💔'}  ${G.ok}/5`:m=='ch'?`🎯 ${G.streak}/10`:`✅ ${G.ok}`;
 $('#h2').textContent=`🔥 ${G.combo}연속`;$('#h3').textContent=`+${G.xp} XP`;
 if(m=='ta')$('#tb>i').style.width=G.t/60*100+'%';
}
function pop(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

function submit(){
 if(!G||G.done)return;const v=$('#in').value.trim();if(v==='')return;
 const q=G.q,r=S.ops[q.o],d=S.days[day()]||(S.days[day()]={n:0,c:0});
 r[1]++;d.n++;const q$=$('#q');
 if(parseInt(v,10)===q.a){
  r[0]++;d.c++;G.ok++;G.combo++;G.streak++;G.maxC=Math.max(G.maxC,G.combo);S.maxCombo=Math.max(S.maxCombo,G.combo);
  let x=10+DIFF[cfg.diff][2]/50|0,b=G.combo%5==0?20:0;if(G.mode=='ms')x+=10;
  G.xp+=x+b;S.xp+=x+b;pop(b?`🔥 ${G.combo}연속 보너스 +${b}!`:`+${x} XP`);
  q$.className='q ok';
 }else{G.bad++;G.combo=0;G.streak=0;if(G.mode=='ms')G.lives--;q$.className='q bad';pop(`정답: ${q.a}`)}
 save();
 if(G.mode=='ch'&&G.streak>=10)return end(true,true);
 if(G.mode=='ms'&&(G.ok>=5||G.lives<=0))return end(true,G.ok>=5);
 setTimeout(()=>{if(G&&!G.done)next()},G.combo?250:700);hud();
}

function end(natural,win){
 if(!G||G.done)return;G.done=true;clearInterval(timer);
 if(G.mode=='ta'&&G.ok>S.best.ta)S.best.ta=G.ok;
 if(win&&G.mode=='ch'){S.xp+=100;G.xp+=100;S.wins.ch++}
 if(win&&G.mode=='ms'){S.xp+=100;G.xp+=100;S.wins.ms++}
 const nb=BADGES.filter(b=>!S.badges.includes(b[0])&&b[3](S));nb.forEach(b=>S.badges.push(b[0]));save();
 const up=lvl(S.xp)>G.lvl0,tt=G.ok+G.bad,acc=tt?Math.round(G.ok/tt*100):0;
 const title=G.mode=='ch'?(win?'🏆 챌린지 클리어!':'😢 아쉬워요'):G.mode=='ms'?(win?'👑 마스터 클리어!':'😢 다시 도전!'):G.mode=='ta'?'⏱️ 타임 업!':'수고했어요!';
 app.innerHTML=`<div class="card"><div class="big">${up?'🎉':win?'🎊':'✨'}</div><h1 style="text-align:center">${title}</h1>${up?`<p style="text-align:center;font-weight:700;color:var(--gold)">LEVEL UP! Lv.${lvl(S.xp)}</p>`:''}
 <p style="text-align:center">정답 ${G.ok} · 오답 ${G.bad} · 정확도 ${acc}%<br>최고 ${G.maxC}연속 · 획득 +${G.xp} XP</p>
 ${nb.length?`<h2>🎖️ 새 뱃지</h2><div class="badges">${nb.map(b=>`<div class="bd"><span>${b[1]}</span>${b[2]}</div>`).join('')}</div>`:''}</div>
 ${xpBar()}<div class="row"><button class="btn" onclick="start('${G.mode}')">다시 하기</button><button class="btn ghost" onclick="home()">홈으로</button></div>`;
 if(up||win)confetti();
}
function confetti(){for(let i=0;i<24;i++){const e=document.createElement('div');e.textContent=['⭐','🎉','✨','🌟'][i%4];e.style.cssText=`position:fixed;top:-20px;left:${Math.random()*100}%;font-size:24px;pointer-events:none;z-index:9;transition:transform 1.8s ease-in,opacity 1.8s;`;document.body.appendChild(e);requestAnimationFrame(()=>{e.style.transform=`translateY(${innerHeight+40}px) rotate(${R(-360,360)}deg)`;e.style.opacity=.2});setTimeout(()=>e.remove(),1900)}}

function stats(){
 const t=S.days[day()]||{n:0,c:0},ds=[];
 for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toLocaleDateString('sv');ds.push([k.slice(5),(S.days[k]||{n:0}).n])}
 const mx=Math.max(1,...ds.map(d=>d[1]));
 const rows=Object.keys(OPS).map(o=>{const[c,n]=S.ops[o];return{o,c,n,p:n?Math.round(c/n*100):null}});
 const ok=rows.filter(r=>r.n>=5).sort((a,b)=>b.p-a.p);
 const msg=ok.length>=2?`💪 강점: ${OPS[ok[0].o]} (${ok[0].p}%)<br>🎯 보완할 점: ${OPS[ok[ok.length-1].o]} (${ok[ok.length-1].p}%) 를 더 연습해 보세요!`:'연산별로 5문제 이상 풀면 강점/약점을 분석해 드려요.';
 app.innerHTML=`<div class="top" style="margin-bottom:10px"><h1>📊 내 통계</h1><button class="chip" onclick="home()">← 홈</button></div>
 <div class="card"><h2>오늘</h2><p style="margin:0;font-size:18px"><b>${t.n}</b>문제 · 정답 <b>${t.c}</b> · 정확도 <b>${t.n?Math.round(t.c/t.n*100):0}%</b></p></div>
 <div class="card"><h2>최근 7일 푼 문제 수</h2><div class="cols">${ds.map(d=>`<div><span>${d[1]||''}</span><i style="height:${d[1]/mx*60}px"></i>${d[0]}</div>`).join('')}</div></div>
 <div class="card"><h2>연산별 정확도</h2>${rows.map(r=>`<div class="rowp"><b>${OPS[r.o]}</b><div class="bar"><i style="width:${r.p||0}%"></i></div><span>${r.p===null?'-':r.p+'%'}</span></div>`).join('')}<p class="sub" style="margin-bottom:0">${msg}</p></div>
 <div class="card"><h2>기록</h2><p class="sub" style="margin:0">누적 정답 ${tot(S)} · 최고 연속 ${S.maxCombo} · 타임어택 최고 ${S.best.ta}문제</p></div>`;
}
home();
</script>
</body>
</html>
