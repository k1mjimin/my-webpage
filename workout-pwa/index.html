<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동 체크">
<title>운동 체크리스트</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#EDF1EE;--surface:#fff;--ink:#12231D;--muted:#5F716A;--line:#D3DCD7;--accent:#0E6B52;--accent-ink:#fff;--select:#E1F0EA;--danger:#B3402F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A16;--surface:#17261F;--ink:#E6F0EB;--muted:#92A59C;--line:#2A3C33;--accent:#4FC9A0;--accent-ink:#06241A;--select:#1F3A2F;--danger:#EE8C7B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A16;--surface:#17261F;--ink:#E6F0EB;--muted:#92A59C;--line:#2A3C33;--accent:#4FC9A0;--accent-ink:#06241A;--select:#1F3A2F;--danger:#EE8C7B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:22px 16px 48px}
h1{margin:0 0 14px;font-size:24px;font-weight:900;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{height:42px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav .t{font-weight:700;font-size:17px;text-align:center;flex:1}
.nav button{min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px}
.nav .today{font-size:14px;padding:0 12px}
.summary{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .tr{stroke:var(--line)}.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:900}
.count{font-size:30px;font-weight:900;line-height:1.1}.count small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.msg{margin:4px 0 0;color:var(--muted);font-size:14px}
.add{display:flex;gap:6px}
.add input,.add select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 10px}
.add input{flex:1;min-width:0}.add select{width:72px}
.add button{height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.sub{margin:12px 0 8px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500}
.chip:disabled{opacity:.5;cursor:default}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px 6px 3px 3px}
.row.selected{background:var(--select);border-color:var(--accent)}
.check{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:none;padding:0}
.box{width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;transition:.15s}
.box svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.done .box{background:var(--accent);border-color:var(--accent)}.row.done .box svg{opacity:1}
.name{flex:1;min-width:0;text-align:left;border:0;background:none;padding:8px 2px;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.row.done .name{color:var(--muted)}
.val{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px}
.val input{width:68px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;text-align:right;padding:0 8px}
.del{width:40px;height:44px;flex:none;border:0;background:none;color:var(--muted);font-size:20px}.del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:28px 0;border:1.5px dashed var(--line);border-radius:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding-bottom:4px}
.cal button,.cal i{aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;font-style:normal}
.cal button{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:14px;font-weight:500;position:relative;padding:0}
.cal button small{font-size:10px;color:var(--muted);line-height:1.1}
.cal button.l1{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.cal button.l2{background:color-mix(in srgb,var(--accent) 48%,var(--bg))}
.cal button.l3{background:var(--accent);color:var(--accent-ink)}.cal button.l3 small{color:var(--accent-ink)}
.cal button.today{border-color:var(--ink)}.cal button.sel{outline:3px solid var(--accent);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--muted);font-size:9px;font-family:inherit}.chart .b{fill:var(--accent)}.chart .z{fill:var(--line)}
.lrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.lrow .n{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .tk{flex:1;height:10px;border-radius:6px;background:var(--bg);overflow:hidden}.lrow .tk i{display:block;height:100%;background:var(--accent);border-radius:6px}
.lrow .s{width:96px;text-align:right;color:var(--muted);font-size:13px;flex:none}
details{font-size:14px;color:var(--muted)}summary{cursor:pointer;min-height:32px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.inst{display:none;width:100%;height:44px;margin-bottom:12px;border:1px solid var(--accent);border-radius:12px;background:var(--select);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>💪 운동 체크리스트</h1>
  <button class="inst" id="inst" type="button">홈 화면에 추가</button>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="log">기록</button>
    <button role="tab" data-tab="cal">달력</button>
    <button role="tab" data-tab="stat">통계</button>
  </div>
  <div id="view"></div>
  <div class="card">
    <details>
      <summary>홈 화면에 추가하는 방법</summary>
      <p><b>iPhone(Safari)</b>: 공유 버튼 → "홈 화면에 추가"<br><b>Android(Chrome)</b>: 메뉴(⋮) → "홈 화면에 추가" 또는 "앱 설치"</p>
    </details>
    <p class="note">기록은 이 기기·브라우저의 로컬 저장소에 저장됩니다. 휴대폰과 PC 간에는 자동 동기화되지 않으며, 브라우저 데이터를 삭제하면 기록도 지워집니다.</p>
  </div>
</main>
<script>
(function(){
var KEY='wk-v2',PRESETS=[['러닝','km'],['자전거','km'],['푸시업','개'],['스트레칭','분'],['요가','분'],['필라테스','분']],DOW=['일','월','화','수','목','금','토'];
var C=2*Math.PI*44;
function p(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var T=ymd(new Date());
var S={ex:[],logs:{},date:T,month:T.slice(0,7),tab:'log',sel:null,stat:null};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&Array.isArray(o.ex))S.ex=o.ex;if(o&&o.logs)S.logs=o.logs}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ex:S.ex,logs:S.logs}))}catch(e){}}
function get(d,id){return(S.logs[d]||{})[id]||{d:false,v:''}}
function put(d,id,patch){var l=S.logs[d]=S.logs[d]||{};var c=get(d,id);l[id]={d:'d' in patch?patch.d:c.d,v:'v' in patch?patch.v:c.v};save()}
function doneCount(d){return S.ex.filter(function(e){return get(d,e.id).d}).length}
function dim(m){var a=m.split('-');return new Date(+a[0],+a[1],0).getDate()}
function fmtN(n){return (Math.round(n*10)/10).toString()}
var view=document.getElementById('view');

function summary(d){
  var t=S.ex.length,n=doneCount(d),pc=t?Math.round(n/t*100):0;
  return '<div class="card summary" id="sum"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="44"/><circle class="bar" cx="50" cy="50" r="44" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-pc/100)+'"/></svg><div class="pct">'+pc+'%</div></div><div><div class="count">'+n+'<small>/ '+t+' 완료</small></div><p class="msg">'+(!t?'운동을 추가해 보세요.':n===t?'모두 마쳤어요!':(t-n)+'개 남았어요.')+'</p></div></div>';
}
function renderLog(){
  var d=S.date,dt=parse(d),h='';
  h+='<div class="nav"><button data-act="day" data-n="-1" aria-label="이전 날">‹</button><div class="t">'+(dt.getMonth()+1)+'월 '+dt.getDate()+'일 ('+DOW[dt.getDay()]+')</div>'+(d!==T?'<button class="today" data-act="gotoday">오늘</button>':'')+'<button data-act="day" data-n="1" aria-label="다음 날">›</button></div>';
  h+=summary(d);
  h+='<div class="card"><div class="add"><input id="nm" maxlength="30" placeholder="운동 이름" aria-label="운동 이름"><select id="un" aria-label="단위"><option>km</option><option>개</option><option>분</option><option value="">없음</option></select><button data-act="add">추가</button></div>';
  h+='<p class="sub">자주 하는 운동</p><div class="chips">'+PRESETS.map(function(x,i){var has=S.ex.some(function(e){return e.name===x[0]});return '<button class="chip" data-act="preset" data-i="'+i+'"'+(has?' disabled':'')+'>'+(has?'✓ ':'+ ')+x[0]+' ('+x[1]+')</button>'}).join('')+'</div></div>';
  h+='<ul>'+(S.ex.length?S.ex.map(function(e){var l=get(d,e.id);
    return '<li class="row'+(l.d?' done':'')+(S.sel===e.id?' selected':'')+'" data-id="'+e.id+'"><button class="check" data-act="toggle" data-id="'+e.id+'" role="checkbox" aria-checked="'+l.d+'" aria-label="'+esc(e.name)+' 완료"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span></button><button class="name" data-act="select" data-id="'+e.id+'">'+esc(e.name)+'</button>'+(e.unit?'<label class="val"><input type="number" inputmode="decimal" min="0" step="any" data-val="'+e.id+'" value="'+esc(l.v)+'" aria-label="'+esc(e.name)+' 수치"><span>'+esc(e.unit)+'</span></label>':'')+'<button class="del" data-act="del" data-id="'+e.id+'" aria-label="'+esc(e.name)+' 삭제">×</button></li>'}).join(''):'<li class="empty">등록한 운동이 없어요. 위에서 추가해 보세요.</li>')+'</ul>';
  view.innerHTML=h;
}
function renderCal(){
  var a=S.month.split('-'),y=+a[0],m=+a[1],first=new Date(y,m-1,1).getDay(),n=dim(S.month),h='';
  h+='<div class="nav"><button data-act="mon" data-n="-1" aria-label="이전 달">‹</button><div class="t">'+y+'년 '+m+'월</div><button data-act="mon" data-n="1" aria-label="다음 달">›</button></div><div class="card"><div class="cal">';
  DOW.forEach(function(x){h+='<div class="h">'+x+'</div>'});
  for(var i=0;i<first;i++)h+='<i></i>';
  for(var d=1;d<=n;d++){var k=S.month+'-'+p(d),c=doneCount(k),t=S.ex.length,r=t?c/t:0,lv=c===0?'':r>=1?'l3':r>=.5?'l2':'l1';
    h+='<button class="'+lv+(k===T?' today':'')+(k===S.date?' sel':'')+'" data-act="pick" data-d="'+k+'" aria-label="'+m+'월 '+d+'일, '+c+'개 완료">'+d+(c?'<small>'+c+'/'+t+'</small>':'')+'</button>'}
  h+='</div><p class="note">날짜를 누르면 그날의 기록을 보고 수정할 수 있어요. 진할수록 달성률이 높아요.</p></div>';
  view.innerHTML=h;
}
function renderStat(){
  var a=S.month.split('-'),n=dim(S.month),h='',days=[],i;
  for(i=1;i<=n;i++)days.push(S.month+'-'+p(i));
  var active=days.filter(function(k){return doneCount(k)>0}).length,total=0;
  days.forEach(function(k){total+=doneCount(k)});
  h+='<div class="nav"><button data-act="mon" data-n="-1" aria-label="이전 달">‹</button><div class="t">'+a[0]+'년 '+(+a[1])+'월 통계</div><button data-act="mon" data-n="1" aria-label="다음 달">›</button></div>';
  h+='<div class="stats"><div class="stat"><b>'+active+'일</b><span>운동한 날</span></div><div class="stat"><b>'+total+'회</b><span>완료 총계</span></div><div class="stat"><b>'+(n?Math.round(active/n*100):0)+'%</b><span>실천율</span></div></div>';
  if(!S.ex.length){view.innerHTML=h+'<div class="empty">기록 탭에서 운동을 추가하면 통계가 표시돼요.</div>';return}
  var ex=S.ex.filter(function(e){return e.id===S.stat})[0]||S.ex[0];S.stat=ex.id;
  var vals=days.map(function(k){var l=get(k,ex.id);return ex.unit?(parseFloat(l.v)||0):(l.d?1:0)});
  var sum=vals.reduce(function(x,y){return x+y},0),dd=days.filter(function(k){return get(k,ex.id).d}).length,max=Math.max.apply(null,vals.concat([1])),bw=300/n;
  h+='<div class="card"><div class="chips" style="margin-bottom:12px">'+S.ex.map(function(e){return '<button class="chip" data-act="stex" data-id="'+e.id+'" aria-pressed="'+(e.id===ex.id)+'">'+esc(e.name)+'</button>'}).join('')+'</div>';
  h+='<div class="stats"><div class="stat"><b>'+(ex.unit?fmtN(sum)+ex.unit:dd+'일')+'</b><span>월 누적</span></div><div class="stat"><b>'+dd+'일</b><span>실천일수</span></div><div class="stat"><b>'+(ex.unit&&dd?fmtN(sum/dd)+ex.unit:'-')+'</b><span>실천일 평균</span></div></div>';
  h+='<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="'+esc(ex.name)+' 일별 그래프"><text x="10" y="9">'+fmtN(max)+(ex.unit||'')+'</text><rect class="z" x="10" y="120" width="300" height="1"/>';
  vals.forEach(function(v,j){var hh=v/max*100;h+='<rect class="b" x="'+(10+j*bw+bw*.12)+'" y="'+(120-hh)+'" width="'+bw*.76+'" height="'+Math.max(hh,v>0?1:0)+'" rx="1.5"/>';if(j===0||(j+1)%5===0)h+='<text x="'+(10+j*bw+bw/2)+'" y="135" text-anchor="middle">'+(j+1)+'</text>'});
  h+='</svg></div><div class="card"><p class="sub" style="margin-top:0">운동별 월간 요약</p>';
  S.ex.forEach(function(e){var s=0,c=0;days.forEach(function(k){var l=get(k,e.id);if(l.d)c++;s+=parseFloat(l.v)||0});
    h+='<div class="lrow"><span class="n">'+esc(e.name)+'</span><span class="tk"><i style="width:'+(n?c/n*100:0)+'%"></i></span><span class="s">'+c+'일'+(e.unit?' · '+fmtN(s)+e.unit:'')+'</span></div>'});
  view.innerHTML=h+'</div>';
}
function render(){
  document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===S.tab))});
  (S.tab==='log'?renderLog:S.tab==='cal'?renderCal:renderStat)();
}
function addEx(name,unit){S.ex.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name,unit:unit});save()}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='day'){var dt=parse(S.date);dt.setDate(dt.getDate()+ +t.dataset.n);S.date=ymd(dt)}
  else if(a==='gotoday')S.date=T;
  else if(a==='mon'){var q=S.month.split('-'),m=new Date(+q[0],+q[1]-1+ +t.dataset.n,1);S.month=m.getFullYear()+'-'+p(m.getMonth()+1)}
  else if(a==='pick'){S.date=t.dataset.d;S.tab='log'}
  else if(a==='stex')S.stat=id;
  else if(a==='toggle')put(S.date,id,{d:!get(S.date,id).d});
  else if(a==='select')S.sel=S.sel===id?null:id;
  else if(a==='del'){S.ex=S.ex.filter(function(e){return e.id!==id});Object.keys(S.logs).forEach(function(k){delete S.logs[k][id]});if(S.sel===id)S.sel=null;save()}
  else if(a==='preset'){var x=PRESETS[+t.dataset.i];addEx(x[0],x[1])}
  else if(a==='add'){var nm=document.getElementById('nm'),v=nm.value.trim();if(!v){nm.focus();return}addEx(v,document.getElementById('un').value)}
  render();
  if(a==='add'){var n2=document.getElementById('nm');if(n2)n2.focus()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='nm'){var b=document.querySelector('[data-act="add"]');if(b)b.click()}});
document.addEventListener('input',function(ev){
  var id=ev.target.dataset&&ev.target.dataset.val;if(!id)return;
  var v=ev.target.value,cur=get(S.date,id),patch={v:v};
  if(v!==''&&parseFloat(v)>0)patch.d=true;
  put(S.date,id,patch);
  var li=ev.target.closest('li'),dn=get(S.date,id).d;
  li.classList.toggle('done',dn);li.querySelector('.check').setAttribute('aria-checked',String(dn));
  document.getElementById('sum').outerHTML=summary(S.date);
});
// 홈 화면 추가
var dp=null,ib=document.getElementById('inst');
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;ib.style.display='block'});
ib.onclick=function(){if(dp){dp.prompt();dp=null;ib.style.display='none'}};
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})}
render();
})();
</script>
</body>
</html>
