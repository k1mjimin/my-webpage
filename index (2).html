<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 시작 홈페이지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 45%, #f8faff 100%);
      color: #20243a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }
    .container {
      width: min(960px, 100%);
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    .greeting {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin: 0 0 8px;
    }
    .date {
      color: #68708a;
      font-size: 16px;
    }
    .clock {
      margin-top: 6px;
      font-size: clamp(32px, 7vw, 58px);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .search {
      background: rgba(255,255,255,.86);
      border: 1px solid #e3e7f4;
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 12px 35px rgba(42, 55, 110, .08);
      margin-bottom: 20px;
    }
    .search form {
      display: flex;
      gap: 8px;
    }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: #f5f7fc;
      border-radius: 15px;
      padding: 16px 18px;
      font-size: 16px;
      color: #20243a;
    }
    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    .search button {
      padding: 0 22px;
      border-radius: 15px;
      background: #5b67d8;
      color: white;
      font-weight: 700;
    }
    .todo-card {
      background: rgba(255,255,255,.9);
      border: 1px solid #e3e7f4;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(42, 55, 110, .08);
    }
    .todo-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .todo-title h2 {
      margin: 0;
      font-size: 21px;
    }
    .count {
      color: #69718b;
      font-size: 14px;
    }
    .add {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .add input {
      flex: 1;
      border: 1px solid #e0e4f0;
      border-radius: 13px;
      padding: 13px 14px;
      outline: none;
      font-size: 15px;
    }
    .add button {
      background: #20243a;
      color: white;
      border-radius: 13px;
      padding: 0 17px;
      font-weight: 700;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 4px;
      border-bottom: 1px solid #edf0f6;
    }
    li:last-child { border-bottom: 0; }
    li input[type="checkbox"] {
      width: 19px;
      height: 19px;
      accent-color: #5b67d8;
      cursor: pointer;
    }
    li span {
      flex: 1;
      word-break: break-word;
    }
    li.done span {
      text-decoration: line-through;
      color: #9aa1b5;
    }
    .delete {
      color: #9aa1b5;
      background: transparent;
      font-size: 18px;
      padding: 4px 8px;
    }
    .empty {
      color: #9aa1b5;
      text-align: center;
      padding: 22px 0 8px;
    }
    @media (max-width: 560px) {
      body { padding: 22px 12px; }
      .search form, .add { flex-direction: column; }
      .search button, .add button { padding: 13px; }
      .todo-card { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1 class="greeting">좋은 하루 보내세요 ✨</h1>
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
    </header>

    <section class="search">
      <form action="https://www.google.com/search" method="get">
        <input name="q" type="search" placeholder="Google에서 검색해 보세요" autocomplete="off" autofocus>
        <button type="submit">검색</button>
      </form>
    </section>

    <section class="todo-card">
      <div class="todo-title">
        <h2>오늘의 할 일</h2>
        <span class="count" id="count"></span>
      </div>
      <form class="add" id="todoForm">
        <input id="todoInput" type="text" placeholder="할 일을 입력하세요" maxlength="120">
        <button type="submit">추가</button>
      </form>
      <ul id="todoList"></ul>
      <div class="empty" id="empty">오늘 할 일을 추가해 보세요.</div>
    </section>
  </main>

  <script>
    const dateEl = document.getElementById("date");
    const clockEl = document.getElementById("clock");
    const form = document.getElementById("todoForm");
    const input = document.getElementById("todoInput");
    const list = document.getElementById("todoList");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "long"
    });

    function updateClock() {
      const now = new Date();
      dateEl.textContent = dateFormatter.format(now);
      clockEl.textContent = now.toLocaleTimeString("ko-KR", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }

    let todos = JSON.parse(localStorage.getItem("myStartPageTodos") || "[]");

    function save() {
      localStorage.setItem("myStartPageTodos", JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";
      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todos[index].done = checkbox.checked;
          save();
          render();
        });

        const span = document.createElement("span");
        span.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.textContent = "×";
        del.setAttribute("aria-label", "할 일 삭제");
        del.addEventListener("click", () => {
          todos.splice(index, 1);
          save();
          render();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });

      empty.style.display = todos.length ? "none" : "block";
      const remaining = todos.filter(t => !t.done).length;
      count.textContent = todos.length ? `남은 일 ${remaining}개` : "";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save();
      render();
      input.value = "";
      input.focus();
    });

    updateClock();
    setInterval(updateClock, 1000);
    render();
  </script>
</body>
</html>
