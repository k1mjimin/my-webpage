<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시계 읽기 연습</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--text:#2b2b2b;--sub:#6b6b6b;--accent:#ff8a3d;--accent-t:#fff;--ok:#2e9e5b;--bad:#e0483e;--line:#e6dcc3;--tick:#444;--hourc:#2b6cff;--minc:#e0483e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b16;--card:#2a2720;--text:#f2eee3;--sub:#b5ad9a;--line:#4a4435;--tick:#ddd;--hourc:#7aa5ff;--minc:#ff7a70;--accent-t:#1d1b16}}
:root[data-theme="dark"]{--bg:#1d1b16;--card:#2a2720;--text:#f2eee3;--sub:#b5ad9a;--line:#4a4435;--tick:#ddd;--hourc:#7aa5ff;--minc:#ff7a70;--accent-t:#1d1b16}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.5rem;text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.levels button{padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:1rem;cursor:pointer}
.levels button small{display:block;color:var(--sub);font-size:.8rem}
.levels button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-t)}
.levels button.on small{color:var(--accent-t)}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
.face{fill:var(--card);stroke:var(--tick);stroke-width:3}
.num{fill:var(--text);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:inherit}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:1.3rem}
.ans input{width:72px;font:inherit;font-size:1.5rem;text-align:center;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.ans input:focus{outline:3px solid var(--accent);border-color:var(--accent)}
.ans{flex-direction:column;gap:12px}.st{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px}.pm[data-d="-1"]{order:-1}.fld{min-width:130px;justify-content:center;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:2px 12px;gap:2px}.fld:focus-within{border-color:var(--accent);outline:3px solid var(--accent)}.fld input,.fld input:focus{width:60px;border:0;outline:0;background:transparent;padding:6px 0;-moz-appearance:textfield;appearance:textfield}.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.fld span{font-size:1.5rem}.fld{display:flex;align-items:center;gap:6px}
.pm{width:54px;height:44px;border-radius:14px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-size:1.6rem;line-height:1;cursor:pointer}.pm:active{background:var(--accent);color:var(--accent-t)}
.btn{font:inherit;font-size:1.15rem;padding:10px 20px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-t);cursor:pointer}
.btn.ghost{background:transparent;color:var(--sub);border:2px solid var(--line);font-size:.9rem;padding:6px 12px}
.row{display:flex;justify-content:center;gap:10px;margin-top:10px}
#msg{min-height:3.2em;text-align:center;font-size:1.1rem;margin-top:8px;line-height:1.5}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.stats b{display:block;font-size:1.6rem}
.stats span{color:var(--sub);font-size:.85rem}
.fx{position:fixed;bottom:-60px;font-size:2.2rem;pointer-events:none;z-index:50;animation:rise 2.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:.9}}
.pop{position:fixed;font-size:1.8rem;pointer-events:none;z-index:50;animation:pop 1.2s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
</style>
</head>
<body>
<main>
<h1>⏰ 시계 읽기 연습</h1>
<div class="card"><div class="levels" id="levels"></div></div>
<div class="card">
<svg viewBox="0 0 200 200" id="clock" role="img" aria-label="아날로그 시계"></svg>
<div class="ans">
<div class="st"><button class="pm" data-f="h" data-d="1" aria-label="시 늘리기">＋</button><div class="fld"><input id="h" type="number" inputmode="numeric" min="1" max="12" aria-label="시"><span>시</span></div><button class="pm" data-f="h" data-d="-1" aria-label="시 줄이기">－</button></div>
<div class="st"><button class="pm" data-f="m" data-d="1" aria-label="분 늘리기">＋</button><div class="fld"><input id="m" type="number" inputmode="numeric" min="0" max="59" aria-label="분"><span>분</span></div><button class="pm" data-f="m" data-d="-1" aria-label="분 줄이기">－</button></div>
</div>
<div id="stepnote" style="text-align:center;color:var(--sub);font-size:.85rem;margin-top:6px"></div>
<div class="row"><button class="btn" id="check">정답 확인</button><button class="btn" id="next" style="display:none">다음 문제 ▶</button></div>
<div id="msg" aria-live="polite"></div>
</div>
<div class="card stats">
<div><b id="sT">0</b><span>총 문제</span></div>
<div><b id="sC" style="color:var(--ok)">0</b><span>맞은 문제</span></div>
<div><b id="sW" style="color:var(--bad)">0</b><span>틀린 문제</span></div>
</div>
<div class="row" style="margin-top:0"><button class="btn ghost" id="reset">기록 지우기</button></div>
</main>
<script>
(function(){
var LV=[["1단계","정시 (00분)"],["2단계","15분 단위"],["3단계","5분 단위"],["4단계","1분 단위"]];
var level=0,cur=null,locked=false,stat={t:0,c:0,w:0},timer=null;
var NS="http://www.w3.org/2000/svg",svg=document.getElementById("clock");
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
el("circle",{cx:100,cy:100,r:96,class:"face"});
for(var i=0;i<60;i++){var big=i%5===0,a=i*6*Math.PI/180,r1=big?84:88,r2=93;
el("line",{x1:100+r1*Math.sin(a),y1:100-r1*Math.cos(a),x2:100+r2*Math.sin(a),y2:100-r2*Math.cos(a),stroke:"var(--tick)","stroke-width":big?2.5:1,"stroke-linecap":"round"})}
for(var n=1;n<=12;n++){var b=n*30*Math.PI/180;var t=el("text",{x:100+70*Math.sin(b),y:100-70*Math.cos(b),class:"num"});t.textContent=n}
var hand=el("line",{x1:100,y1:100,x2:100,y2:56,stroke:"var(--hourc)","stroke-width":7,"stroke-linecap":"round"});
var mand=el("line",{x1:100,y1:100,x2:100,y2:26,stroke:"var(--minc)","stroke-width":4,"stroke-linecap":"round"});
el("circle",{cx:100,cy:100,r:5,fill:"var(--tick)"});
function draw(h,m){
 var ma=m*6, ha=(h%12)*30+m*0.5; // 분침 1분=6°, 시침 1시간=30°, 1분=0.5°
 mand.setAttribute("transform","rotate("+ma+" 100 100)");
 hand.setAttribute("transform","rotate("+ha+" 100 100)");
}
var lv=document.getElementById("levels");
LV.forEach(function(l,i){var b=document.createElement("button");b.innerHTML=l[0]+"<small>"+l[1]+"</small>";b.onclick=function(){level=i;mark();newQ()};lv.appendChild(b)});
var STEP=[5,15,5,1];
function mark(){[].forEach.call(lv.children,function(b,i){b.className=i===level?"on":""});document.getElementById("stepnote").textContent="분 버튼은 "+STEP[level]+"분씩, 시 버튼은 1시간씩 바뀌어요"}
function bump(f,d){
 if(locked)return;var inp=document.getElementById(f),isH=f==="h",step=isH?1:STEP[level],v;
 if(inp.value===""){v=d>0?(isH?1:0):(isH?12:60-step)}
 else{v=parseInt(inp.value,10)+d*step;
  if(isH){if(v>12)v=1;if(v<1)v=12}else{v=((v%60)+60)%60}}
 inp.value=v;
}
var $=function(id){return document.getElementById(id)};
function rnd(n){return Math.floor(Math.random()*n)}
function newQ(){
 clearTimeout(timer);locked=false;
 var h=1+rnd(12),m;
 if(level===0)m=0;else if(level===1)m=rnd(4)*15;else if(level===2)m=rnd(12)*5;else m=rnd(60);
 if(cur&&cur.h===h&&cur.m===m){return newQ()}
 cur={h:h,m:m};draw(h,m);
 $("h").value="";$("m").value="";$("msg").textContent="";$("msg").className="";
 $("check").style.display="";$("next").style.display="none";$("h").focus();
}
function hint(q){
 var mh="분침이 가리키는 숫자에 5를 곱해요. ";
 var s="짧은바늘(시침)이 가리키거나 막 지나온 숫자가 시예요. ";
 if(q.m===0)s="긴바늘(분침)이 12를 가리키면 정각이에요. 짧은바늘이 가리키는 숫자가 시예요.";
 else if(q.m===30)s="긴바늘이 6을 가리키면 30분이에요. 짧은바늘은 두 숫자의 가운데이고, 지나온 숫자가 시예요.";
 else s=s+mh+"숫자 "+Math.floor(q.m/5)+"까지는 "+(Math.floor(q.m/5)*5)+"분이고, 작은 눈금을 "+(q.m%5)+"칸 더 세요.";
 return s;
}
function celebrate(){
 var em=["🎈","🎉","🎈","🎊","🎈","✨"];
 for(var i=0;i<14;i++){(function(i){setTimeout(function(){
  var d=document.createElement("div");d.className="fx";d.textContent=em[rnd(em.length)];
  d.style.left=(rnd(90)+2)+"vw";d.style.animationDuration=(1.6+Math.random())+"s";
  document.body.appendChild(d);setTimeout(function(){d.remove()},3000)},i*60)})(i)}
 for(var j=0;j<16;j++){var p=document.createElement("div");p.className="pop";p.textContent=["🎆","🎇","🎉","⭐"][rnd(4)];
  p.style.left="50vw";p.style.top="40vh";var ang=j/16*6.283,dist=90+rnd(110);
  p.style.setProperty("--dx",Math.cos(ang)*dist+"px");p.style.setProperty("--dy",Math.sin(ang)*dist+"px");
  document.body.appendChild(p);(function(p){setTimeout(function(){p.remove()},1300)})(p)}
}
function upd(){$("sT").textContent=stat.t;$("sC").textContent=stat.c;$("sW").textContent=stat.w}
function check(){
 if(locked)return;
 var hv=$("h").value,mv=$("m").value,msg=$("msg");
 if(hv===""||mv===""){msg.className="";msg.textContent="시와 분을 모두 적어 주세요 ✏️";return}
 var h=parseInt(hv,10),m=parseInt(mv,10);locked=true;stat.t++;
 if(h===cur.h&&m===cur.m){
  stat.c++;msg.className="ok";msg.textContent="🎉 정답이에요! 잘했어요!";celebrate();
  $("check").style.display="none";timer=setTimeout(newQ,1800);
 }else{
  stat.w++;msg.className="bad";
  msg.innerHTML="아쉬워요 😢 정답은 <b>"+cur.h+"시 "+cur.m+"분</b>이에요.<br><small>💡 "+hint(cur)+"</small>";
  $("check").style.display="none";$("next").style.display="";
 }
 upd();
}
[].forEach.call(document.querySelectorAll(".pm"),function(b){b.onclick=function(){bump(b.getAttribute("data-f"),parseInt(b.getAttribute("data-d"),10))}});
$("check").onclick=check;$("next").onclick=newQ;
$("reset").onclick=function(){stat={t:0,c:0,w:0};upd()};
document.addEventListener("keydown",function(e){if(e.key==="Enter"){if($("next").style.display!=="none")newQ();else check()}});
mark();newQ();
})();
</script>
</body>
</html>
