<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>신나는 동물 카드 뒤집기 게임!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti Library for Victory Fireworks -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Jua for cute kids theme) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* Card 3D Flip Styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    
    .card-back {
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
      border: 3px solid #6ee7b7;
      transform: rotateY(0deg);
    }

    .card-front {
      background: linear-gradient(145deg, #ffffff, #fffdf0);
      border: 3px solid #fde047;
      transform: rotateY(180deg);
    }

    @media (min-width: 640px) {
      .card-front, .card-back {
        border-width: 4px;
        border-radius: 1.2rem;
      }
    }

    /* Matched Card Pulse Animation */
    @keyframes matchedPulse {
      0% { transform: rotateY(180deg) scale(1); }
      40% { transform: rotateY(180deg) scale(1.15); }
      70% { transform: rotateY(180deg) scale(0.95); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card-inner.matched .card-front {
      border-color: #4ade80;
      background: linear-gradient(145deg, #f0fdf4, #dcfce7);
      animation: matchedPulse 0.5s ease-in-out;
    }

    /* Score Pop Animation */
    @keyframes scorePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); color: #eab308; }
      100% { transform: scale(1); }
    }
    .score-pop {
      display: inline-block;
      animation: scorePop 0.4s ease-out;
    }

    /* Sparkle Particle Styling */
    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 1.5rem;
      animation: sparkleAnim 0.8s ease-out forwards;
      z-index: 30;
    }

    @keyframes sparkleAnim {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(180deg);
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 10px;
    }

    /* Board Grid Heights Fit Mobile Viewport */
    .board-container {
      max-height: calc(100vh - 160px);
      max-height: calc(100dvh - 160px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-gray-800">

  <!-- Audio Mute Control Floating Button -->
  <button id="soundToggleBtn" onclick="toggleSound()" aria-label="음소거 토글" class="fixed top-3 right-3 z-40 bg-white/90 backdrop-blur border-2 border-pink-300 p-2.5 sm:p-3 rounded-full shadow-lg hover:bg-pink-50 transition transform active:scale-90 text-pink-500">
    <i id="soundIcon" class="fas fa-volume-up text-lg sm:text-xl w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center"></i>
  </button>

  <!-- Header & Title Container -->
  <header class="text-center mt-1 mb-2 max-w-md w-full">
    <div class="inline-block bg-white/85 backdrop-blur-md px-4 py-1.5 sm:px-6 sm:py-2 rounded-full border-3 sm:border-4 border-yellow-300 shadow-md">
      <h1 class="text-2xl sm:text-3xl md:text-4xl text-pink-500 tracking-wider flex items-center justify-center gap-1.5">
        <span>🐶</span> 짝맞추기 메모리 게임 <span>🐱</span>
      </h1>
    </div>
  </header>

  <!-- Control & Stats Panel -->
  <main class="w-full max-w-xl flex flex-col items-center gap-2 sm:gap-3 my-auto">
    
    <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-2.5 sm:p-4 shadow-xl border-2 sm:border-4 border-white flex flex-col sm:flex-row items-center justify-between gap-2">
      
      <!-- Stats Info -->
      <div class="flex items-center justify-around w-full sm:w-auto gap-2 sm:gap-4 text-base sm:text-lg">
        <!-- Timer -->
        <div class="flex items-center gap-1.5 bg-blue-50 px-2.5 py-1 rounded-xl border border-blue-200">
          <i class="fas fa-clock text-blue-500 text-sm sm:text-base"></i>
          <span class="text-gray-500 text-xs sm:text-sm">시간</span>
          <span id="timerText" class="font-bold text-blue-600 text-base sm:text-lg w-11 text-center">00:00</span>
        </div>

        <!-- Score -->
        <div class="flex items-center gap-1.5 bg-yellow-50 px-2.5 py-1 rounded-xl border border-yellow-200">
          <i class="fas fa-star text-yellow-500 text-sm sm:text-base"></i>
          <span class="text-gray-500 text-xs sm:text-sm">점수</span>
          <span id="scoreText" class="font-bold text-yellow-600 text-base sm:text-lg">0</span>
        </div>

        <!-- Tries -->
        <div class="flex items-center gap-1.5 bg-purple-50 px-2.5 py-1 rounded-xl border border-purple-200">
          <i class="fas fa-hand-pointer text-purple-500 text-sm sm:text-base"></i>
          <span class="text-gray-500 text-xs sm:text-sm">시도</span>
          <span id="triesText" class="font-bold text-purple-600 text-base sm:text-lg">0</span>
        </div>
      </div>

      <!-- Controls (Difficulty & Reset) -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
        <!-- Difficulty Select -->
        <select id="difficultySelect" onchange="changeDifficulty()" class="bg-emerald-50 border-2 border-emerald-300 text-emerald-700 font-bold py-1.5 px-2.5 rounded-xl focus:outline-none text-sm sm:text-base cursor-pointer">
          <option value="easy">쉬움 (3x4)</option>
          <option value="normal" selected>보통 (4x4)</option>
          <option value="hard">어려움 (4x5)</option>
        </select>

        <!-- Restart Button -->
        <button onclick="resetGame()" class="bg-gradient-to-r from-pink-400 to-rose-400 active:from-pink-500 active:to-rose-500 text-white font-bold py-1.5 px-3 sm:px-4 rounded-xl shadow-md border-b-2 sm:border-b-4 border-rose-600 active:border-b-0 active:translate-y-0.5 transition flex items-center gap-1.5 text-sm sm:text-base">
          <i class="fas fa-redo-alt"></i> 다시 시작
        </button>
      </div>

    </div>

    <!-- Game Board Canvas Container -->
    <div id="gameBoard" class="w-full board-container grid gap-2 sm:gap-3 p-2.5 sm:p-4 bg-white/40 backdrop-blur-sm rounded-2xl sm:rounded-3xl border-2 sm:border-4 border-white shadow-xl justify-items-center items-center overflow-y-auto">
      <!-- Dynamic Cards -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-gray-600 text-xs my-1 font-sans">
    <p>초등 집중력 향상 디지털 교구 🎈 스마트폰 & 태블릿 지원</p>
  </footer>

  <!-- Victory Modal Popup -->
  <div id="winModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-5 sm:p-7 max-w-sm w-full text-center border-4 sm:border-8 border-yellow-300 shadow-2xl transform scale-90 transition-transform duration-300" id="winModalContent">
      <div class="text-5xl sm:text-6xl mb-1 animate-bounce">🏆</div>
      <h2 class="text-2xl sm:text-3xl font-bold text-pink-500 mb-1">축하합니다! 완주 성공!</h2>
      <p class="text-gray-600 text-sm sm:text-base mb-4">모든 동물 짝을 기억해냈어요!</p>
      
      <!-- Summary Table -->
      <div class="bg-yellow-50 rounded-2xl p-3 sm:p-4 border border-yellow-200 mb-5 space-y-1.5 text-base sm:text-lg">
        <div class="flex justify-between items-center text-gray-700">
          <span><i class="fas fa-star text-yellow-500 mr-1.5"></i>최종 점수:</span>
          <span id="finalScore" class="font-bold text-yellow-600 text-lg sm:text-xl">0점</span>
        </div>
        <div class="flex justify-between items-center text-gray-700">
          <span><i class="fas fa-clock text-blue-500 mr-1.5"></i>소요 시간:</span>
          <span id="finalTime" class="font-bold text-blue-600 text-lg sm:text-xl">00:00</span>
        </div>
        <div class="flex justify-between items-center text-gray-700">
          <span><i class="fas fa-hand-pointer text-purple-500 mr-1.5"></i>총 시도 횟수:</span>
          <span id="finalTries" class="font-bold text-purple-600 text-lg sm:text-xl">0회</span>
        </div>
      </div>

      <button onclick="closeWinModal(); resetGame();" class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white text-lg sm:text-xl font-bold py-2.5 sm:py-3 px-4 rounded-2xl shadow-lg border-b-4 border-teal-700 active:border-b-0 active:translate-y-1 transition transform active:scale-95">
        한 번 더 하기! 🚀
      </button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       Web Audio API - Optimized for Mobile Touch & High Impact Sound FX
       ========================================================================== */
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Card Flip Sound (Quick Pop)
      playFlip() {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.08);

          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
      }

      // Over-the-Top Magical Arcade Match Sound
      playMatch() {
        if (this.muted) return;
        this.init();
        try {
          const now = this.ctx.currentTime;

          // 1. Fast Retro Arcade Arpeggio
          const arpeggioNotes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
          arpeggioNotes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + i * 0.04);

            gain.gain.setValueAtTime(0.12, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.12);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.12);
          });

          // 2. Glissando Pitch Sweep
          const sweepOsc = this.ctx.createOscillator();
          const sweepGain = this.ctx.createGain();

          sweepOsc.type = 'triangle';
          sweepOsc.frequency.setValueAtTime(700, now + 0.12);
          sweepOsc.frequency.exponentialRampToValueAtTime(2200, now + 0.4);

          sweepGain.gain.setValueAtTime(0.15, now + 0.12);
          sweepGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

          sweepOsc.connect(sweepGain);
          sweepGain.connect(this.ctx.destination);

          sweepOsc.start(now + 0.12);
          sweepOsc.stop(now + 0.4);

          // 3. Sparkle Echo Trill
          [1760.00, 2093.00].forEach((freq, idx) => {
            const trillOsc = this.ctx.createOscillator();
            const trillGain = this.ctx.createGain();

            trillOsc.type = 'sine';
            trillOsc.frequency.setValueAtTime(freq, now + 0.3 + (idx * 0.05));

            trillGain.gain.setValueAtTime(0.12, now + 0.3 + (idx * 0.05));
            trillGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

            trillOsc.connect(trillGain);
            trillGain.connect(this.ctx.destination);

            trillOsc.start(now + 0.3 + (idx * 0.05));
            trillOsc.stop(now + 0.7);
          });
        } catch(e) {}
      }

      // Mismatch Error Sound
      playMismatch() {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, this.ctx.currentTime);
          osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.08);

          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.22);
        } catch(e) {}
      }

      // Win Fanfare
      playWin() {
        if (this.muted) return;
        this.init();
        try {
          const melody = [
            { freq: 523.25, duration: 0.15 },
            { freq: 659.25, duration: 0.15 },
            { freq: 783.99, duration: 0.15 },
            { freq: 1046.50, duration: 0.4 }
          ];

          let now = this.ctx.currentTime;
          melody.forEach(note => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note.freq, now);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + note.duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + note.duration);

            now += note.duration;
          });
        } catch(e) {}
      }
    }

    const soundFX = new SoundEffects();

    // Mobile Audio Unlock on First Touch
    window.addEventListener('touchstart', function unlockAudio() {
      soundFX.init();
      window.removeEventListener('touchstart', unlockAudio);
    }, { once: true });

    function toggleSound() {
      soundFX.muted = !soundFX.muted;
      const soundIcon = document.getElementById('soundIcon');
      const soundBtn = document.getElementById('soundToggleBtn');
      
      if (soundFX.muted) {
        soundIcon.className = "fas fa-volume-mute text-lg sm:text-xl w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-gray-400";
        soundBtn.classList.add('bg-gray-100', 'border-gray-300');
        soundBtn.classList.remove('bg-white/90', 'border-pink-300');
      } else {
        soundIcon.className = "fas fa-volume-up text-lg sm:text-xl w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-pink-500";
        soundBtn.classList.remove('bg-gray-100', 'border-gray-300');
        soundBtn.classList.add('bg-white/90', 'border-pink-300');
        soundFX.playFlip();
      }
    }

    /* ==========================================================================
       Game Logic & State Management
       ========================================================================== */
    const ANIMAL_EMOJIS = [
      '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼',
      '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵'
    ];

    const DIFFICULTY_CONFIG = {
      easy: { pairs: 6, cols: 'grid-cols-3 sm:grid-cols-4' },
      normal: { pairs: 8, cols: 'grid-cols-4' },
      hard: { pairs: 10, cols: 'grid-cols-4 sm:grid-cols-5' }
    };

    let currentDifficulty = 'normal';
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let score = 0;
    let tries = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let isBoardLocked = false;
    let isGameActive = false;

    // DOM Elements
    const gameBoard = document.getElementById('gameBoard');
    const scoreText = document.getElementById('scoreText');
    const triesText = document.getElementById('triesText');
    const timerText = document.getElementById('timerText');

    window.onload = () => {
      resetGame();
    };

    function changeDifficulty() {
      currentDifficulty = document.getElementById('difficultySelect').value;
      resetGame();
    }

    function resetGame() {
      clearInterval(timerInterval);
      timerInterval = null;
      secondsElapsed = 0;
      timerText.textContent = "00:00";

      score = 0;
      tries = 0;
      matchedPairs = 0;
      flippedCards = [];
      isBoardLocked = false;
      isGameActive = false;

      scoreText.textContent = score;
      triesText.textContent = tries;

      const config = DIFFICULTY_CONFIG[currentDifficulty];
      const selectedAnimals = ANIMAL_EMOJIS.slice(0, config.pairs);
      const cardPairs = [...selectedAnimals, ...selectedAnimals];
      
      // Shuffle Cards
      cards = cardPairs.sort(() => Math.random() - 0.5).map((emoji, index) => ({
        id: index,
        emoji: emoji,
        isFlipped: false,
        isMatched: false
      }));

      // Adjust Board Layout Grid
      gameBoard.className = `w-full board-container grid gap-2 sm:gap-3 p-2.5 sm:p-4 bg-white/40 backdrop-blur-sm rounded-2xl sm:rounded-3xl border-2 sm:border-4 border-white shadow-xl justify-items-center items-center overflow-y-auto ${config.cols}`;

      renderCards();
    }

    function startTimer() {
      if (timerInterval) return;
      isGameActive = true;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerText.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function renderCards() {
      gameBoard.innerHTML = '';
      
      cards.forEach((card) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'w-full aspect-square perspective-1000 max-w-[100px] sm:max-w-[120px]';
        
        cardContainer.innerHTML = `
          <div class="card-inner" id="card-${card.id}" onclick="handleCardClick(${card.id})">
            <div class="card-back">
              <span class="text-2xl sm:text-3xl text-emerald-400 font-bold opacity-80">❓</span>
            </div>
            <div class="card-front">
              <span class="text-3xl sm:text-5xl select-none filter drop-shadow-sm">${card.emoji}</span>
            </div>
          </div>
        `;
        
        gameBoard.appendChild(cardContainer);
      });
    }

    function handleCardClick(id) {
      if (isBoardLocked) return;
      
      const card = cards[id];
      const cardElement = document.getElementById(`card-${id}`);

      if (card.isFlipped || card.isMatched) return;

      if (!isGameActive) {
        startTimer();
      }

      soundFX.playFlip();
      card.isFlipped = true;
      cardElement.classList.add('flipped');
      flippedCards.push({ card, element: cardElement });

      if (flippedCards.length === 2) {
        tries++;
        triesText.textContent = tries;
        checkMatch();
      }
    }

    function checkMatch() {
      isBoardLocked = true;
      const [card1, card2] = flippedCards;

      if (card1.card.emoji === card2.card.emoji) {
        // Matched!
        setTimeout(() => {
          soundFX.playMatch();
          
          card1.card.isMatched = true;
          card2.card.isMatched = true;

          card1.element.classList.add('matched');
          card2.element.classList.add('matched');

          createSparkles(card1.element);
          createSparkles(card2.element);

          score += 100;
          scoreText.textContent = score;
          triggerScorePop();

          matchedPairs++;
          flippedCards = [];
          isBoardLocked = false;

          const totalPairs = DIFFICULTY_CONFIG[currentDifficulty].pairs;
          if (matchedPairs === totalPairs) {
            handleGameWin();
          }
        }, 250);

      } else {
        // Mismatch
        setTimeout(() => {
          soundFX.playMismatch();

          card1.element.parentElement.classList.add('animate-bounce');
          card2.element.parentElement.classList.add('animate-bounce');

          setTimeout(() => {
            card1.element.parentElement.classList.remove('animate-bounce');
            card2.element.parentElement.classList.remove('animate-bounce');

            card1.card.isFlipped = false;
            card2.card.isFlipped = false;

            card1.element.classList.remove('flipped');
            card2.element.classList.remove('flipped');

            flippedCards = [];
            isBoardLocked = false;
          }, 350);

        }, 600);
      }
    }

    /* ==========================================================================
       Victory & Fireworks Celebration
       ========================================================================== */
    function handleGameWin() {
      clearInterval(timerInterval);
      soundFX.playWin();
      triggerConfetti();

      setTimeout(() => {
        document.getElementById('finalScore').textContent = `${score}점`;
        document.getElementById('finalTime').textContent = timerText.textContent;
        document.getElementById('finalTries').textContent = `${tries}회`;

        const winModal = document.getElementById('winModal');
        const modalContent = document.getElementById('winModalContent');

        winModal.classList.remove('hidden');
        setTimeout(() => {
          winModal.classList.remove('opacity-0');
          modalContent.classList.remove('scale-90');
          modalContent.classList.add('scale-100');
        }, 10);
      }, 500);
    }

    function closeWinModal() {
      const winModal = document.getElementById('winModal');
      const modalContent = document.getElementById('winModalContent');

      winModal.classList.add('opacity-0');
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-90');

      setTimeout(() => {
        winModal.classList.add('hidden');
      }, 300);
    }

    function createSparkles(cardElement) {
      const sparkles = ['✨', '⭐', '🌟', '💖', '🎉'];

      for (let i = 0; i < 5; i++) {
        const sparkle = document.createElement('span');
        sparkle.className = 'sparkle';
        sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];

        const angle = Math.random() * Math.PI * 2;
        const distance = 30 + Math.random() * 40;
        const dx = `${Math.cos(angle) * distance}px`;
        const dy = `${Math.sin(angle) * distance}px`;

        sparkle.style.setProperty('--dx', dx);
        sparkle.style.setProperty('--dy', dy);
        sparkle.style.left = `50%`;
        sparkle.style.top = `50%`;

        cardElement.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
      }
    }

    function triggerScorePop() {
      scoreText.classList.remove('score-pop');
      void scoreText.offsetWidth;
      scoreText.classList.add('score-pop');
    }

    function triggerConfetti() {
      const duration = 2.5 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#f472b6', '#38bdf8', '#4ade80', '#facc15']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#f472b6', '#38bdf8', '#4ade80', '#facc15']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }
  </script>
</body>
</html>
